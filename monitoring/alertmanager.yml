global:
  resolve_timeout: 5m

route:
  receiver: "alert_buster_backend"
  group_by: ["alertname", "instance", "service"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: "alert_buster_backend"
    webhook_configs:
      - url: "http://backend:8000/api/alerts/prometheus"
        send_resolved: true
        max_alerts: 50
